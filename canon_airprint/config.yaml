name: Canon AirPrint
version: "0.2.2"
slug: canon_airprint
description: Shares a Canon UFRII LT printer (like the LBP6030w) as an AirPrint printer for iPhones and Macs, with status sensors.
url: https://github.com/learningcodewithAi/ha-airprint
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: true
host_dbus: false
homeassistant_api: true
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and IPP printing
map:
  - share:rw
options:
  printer_ip: "192.168.7.27"
  printer_name: "Canon_LBP6030w"
  printer_description: "Canon LBP6030w"
  printer_location: "Home"
  driver_url: ""
  driver_match: "LBP6030"
  paper_sizes: "Letter,Legal"
  status_sensors: true
  debug_logging: false
schema:
  printer_ip: str
  printer_name: match(^[A-Za-z0-9_-]+$)
  printer_description: str
  printer_location: str
  driver_url: str?
  driver_match: str?
  paper_sizes: str?
  status_sensors: bool?
  debug_logging: bool?
